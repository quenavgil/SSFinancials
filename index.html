<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saliba · Financial Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--surface:#141414;--surface2:#1C1C1C;--border:#2A2A2A;--border2:#333;
  --text:#F5F5F0;--muted:#888880;--muted2:#555550;
  --gold:#C8A96E;--gold-dim:#8A7248;
  --red:#E05A5A;--red-dim:#7A2A2A;
  --green:#4CAF7D;--green-dim:#2A5A40;
  --amber:#E8A040;
}
html{font-size:14px;background:var(--bg);color:var(--text)}
body{font-family:Inter,sans-serif;min-height:100vh;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}

/* ── LAYOUT ── */
.shell{max-width:1040px;margin:0 auto;padding:0 20px 80px}

/* ── TOP BAR ── */
.topbar{padding:20px 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px}
.brand-name{font-family:"DM Serif Display",serif;font-size:1.5rem;color:var(--text);letter-spacing:-.3px}
.brand-sub{font-size:.7rem;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.last-updated{font-size:.65rem;color:var(--muted2);padding:6px 10px;border:1px solid var(--border);border-radius:4px}

/* ── ACCOUNT TABS ── */
.acct-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-top:24px}
.acct-tab{font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:10px 20px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;background:none;border-top:none;border-left:none;border-right:none}
.acct-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.acct-tab:hover:not(.active){color:var(--text)}

/* ── MONTH SCRUBBER ── */
.month-rail{padding:16px 0 0;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border);margin-bottom:24px}
.month-rail-inner{display:flex;gap:2px;padding-bottom:0;overflow-x:auto;scrollbar-width:none}
.month-rail-inner::-webkit-scrollbar{display:none}
.month-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px 10px;cursor:pointer;border-radius:4px 4px 0 0;border:none;background:none;color:var(--muted);transition:all .15s;min-width:68px;position:relative}
.month-btn:hover:not(.active){color:var(--text)}
.month-btn.active{background:var(--surface);color:var(--text)}
.month-btn.active::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--bg)}
.month-label{font-size:.62rem;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.month-bar{width:44px;height:24px;display:flex;align-items:flex-end;gap:1px}
.month-bar-col{flex:1;border-radius:1px 1px 0 0;transition:opacity .2s}
.month-bar-col.income{background:var(--green);opacity:.5}
.month-bar-col.expense{background:var(--red);opacity:.5}
.month-btn.active .month-bar-col{opacity:1}
.month-amt{font-size:.6rem;color:var(--muted2)}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
.stat-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.stat-value{font-family:"DM Serif Display",serif;font-size:1.65rem;line-height:1;color:var(--text)}
.stat-value.positive{color:var(--green)}
.stat-value.negative{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.stat-sub{font-size:.62rem;color:var(--muted2);margin-top:5px}

/* ── TWO COLUMN ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px 22px}
.card-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.card-title-right{font-family:"DM Serif Display",serif;font-size:.9rem;color:var(--text);letter-spacing:0;text-transform:none}

/* ── CATEGORY BARS ── */
.cat-bar-list{display:flex;flex-direction:column;gap:11px}
.cat-bar-item{display:flex;flex-direction:column;gap:4px}
.cat-bar-top{display:flex;justify-content:space-between;align-items:baseline}
.cat-bar-name{font-size:.72rem;color:var(--text);display:flex;align-items:center;gap:6px}
.cat-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cat-bar-right{font-size:.72rem;color:var(--text);font-weight:600}
.cat-bar-track{height:3px;background:var(--border2);border-radius:99px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.16,1,.3,1)}

/* ── FLOW TABLE (income vs spending) ── */
.flow-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.flow-row:last-child{border-bottom:none}
.flow-row.total{padding-top:12px;margin-top:2px}
.flow-label{font-size:.73rem;color:var(--muted)}
.flow-label.total{color:var(--text);font-weight:600}
.flow-amount{font-size:.73rem;font-weight:600}
.flow-amount.income{color:var(--green)}
.flow-amount.expense{color:var(--red)}
.flow-amount.net-pos{color:var(--green)}
.flow-amount.net-neg{color:var(--red)}
.flow-amount.neutral{color:var(--muted)}

/* ── TX LIST ── */
.tx-controls{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tx-btn{font-size:.62rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.tx-btn.active{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.tx-search{flex:1;min-width:140px;font-family:Inter,sans-serif;font-size:.72rem;padding:6px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.tx-search::placeholder{color:var(--muted2)}
.tx-search:focus{outline:none;border-color:var(--border2)}
.tx-list-wrap{display:flex;flex-direction:column}
.tx-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-left{flex:1;min-width:0}
.tx-date{font-size:.6rem;color:var(--muted2);margin-bottom:2px}
.tx-name{font-size:.75rem;font-weight:500;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-tags{display:flex;gap:5px;flex-wrap:wrap}
.tx-cat{font-size:.57rem;font-weight:600;letter-spacing:.3px;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.tx-acct{font-size:.57rem;padding:2px 7px;border-radius:3px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tx-flag{font-size:.57rem;padding:2px 7px;border-radius:3px;background:#3A2800;color:#E8A040;border:1px solid #5A3800}
.tx-amount{font-family:"DM Serif Display",serif;font-size:1rem;flex-shrink:0;text-align:right}
.tx-amount.debit{color:var(--text)}
.tx-amount.credit{color:var(--green)}
.tx-empty{text-align:center;padding:32px;color:var(--muted2);font-size:.75rem}

/* ── RECOMMENDATIONS ── */
.rec-section{margin-top:24px}
.rec-header{font-size:.6rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rec-header::after{content:"";flex:1;height:1px;background:var(--border)}
.rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 18px;border-left:3px solid var(--border)}
.rec-card.critical{border-left-color:var(--red)}
.rec-card.warning{border-left-color:var(--amber)}
.rec-card.positive{border-left-color:var(--green)}
.rec-card.info{border-left-color:var(--gold)}
.rec-tag{font-size:.55rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.rec-card.critical .rec-tag{color:var(--red)}
.rec-card.warning .rec-tag{color:var(--amber)}
.rec-card.positive .rec-tag{color:var(--green)}
.rec-card.info .rec-tag{color:var(--gold)}
.rec-title{font-family:"DM Serif Display",serif;font-size:.95rem;color:var(--text);margin-bottom:6px;line-height:1.3}
.rec-body{font-size:.68rem;color:var(--muted);line-height:1.6}
.rec-body strong{color:var(--text);font-weight:600}

/* ── SECTION DIVIDER ── */
.section-divider{height:1px;background:var(--border);margin:20px 0}

/* ── NET BAR ── */
.net-bar-wrap{margin:12px 0 4px}
.net-bar-labels{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);margin-bottom:5px}
.net-bar-track{height:6px;background:var(--border2);border-radius:99px;overflow:hidden;display:flex}
.net-bar-income{background:var(--green);height:100%;transition:width .6s}
.net-bar-expense{background:var(--red);height:100%;transition:width .6s}

/* ── FLAG BADGE ── */
.flag-inline{font-size:.6rem;color:var(--amber);margin-left:6px}

@media(max-width:760px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .two-col,.three-col{grid-template-columns:1fr}
  .rec-grid{grid-template-columns:1fr}
}
</style>
</head>

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const CAT_COLORS = {
  'Dining & Delivery':'#C8A96E','Groceries':'#7EB8A0','Gas / Fuel':'#4CAF7D',
  'Venmo':'#E05A5A','Entertainment':'#9B7EBD','Travel':'#5B9BD5',
  'Cash Withdrawal':'#888880','Car Payment':'#D4845A','Auto Maintenance':'#A3C45A',
  'Pharmacy / Personal Care':'#5BB8C4','Shopping / Misc':'#B87EB8',
  'Vending / Misc':'#666660','Rideshare':'#D49A5A','Savings Withdrawal':'#E06060',
  'Internal Transfer':'#444440',
  'Payroll':'#4CAF7D','Other Income':'#6DC87A','Tax Refund':'#3D9E60','Interest':'#7BCCA0'
};

let acct = 'All';
let month = null; // 'YYYY-MM' or null for all
let txFilter = 'all';
let txSearch = '';

function fmtMoney(n){ return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
const EXCL_CATS = ['Internal Transfer – Own Accounts'];

function isSpending(t) { return t.type==='Debit'  && !EXCL_CATS.includes(t.cat); }
function isPayroll(t)  { return t.type==='Credit' && t.cat==='Payroll'; }
function isVenmoIn(t)  { return t.type==='Credit' && t.cat==='Venmo'; }
function isOtherIn(t)  { return t.type==='Credit' && !['Payroll','Venmo'].includes(t.cat) && !EXCL_CATS.includes(t.cat); }
function isTransfer(t) { return EXCL_CATS.includes(t.cat); }

// keep aliases for tx filter buttons
function isExpense(t){ return isSpending(t); }
function isIncome(t) { return isPayroll(t); }
function isVenmoOut(t){ return t.type==='Debit' && t.cat==='Venmo'; }

function filtered(){ return acct==='All' ? RAW : RAW.filter(t=>t.account===acct); }

function getMonths(){
  const set = new Set(filtered().map(t=>t.date.slice(0,7)));
  return [...set].sort();
}

function getMonthTxns(m){ return filtered().filter(t=>t.date.slice(0,7)===m); }

function calcStats(txns){
  const spending  = txns.filter(isSpending);
  const payroll   = txns.filter(isPayroll);
  const venmoIn   = txns.filter(isVenmoIn);
  const otherIn   = txns.filter(isOtherIn);
  const spendTotal   = spending.reduce((s,t)=>s+t.amount,0);
  const payrollTotal = payroll.reduce((s,t)=>s+t.amount,0);
  const venmoInTotal = venmoIn.reduce((s,t)=>s+t.amount,0);
  const otherInTotal = otherIn.reduce((s,t)=>s+t.amount,0);
  const totalIn      = payrollTotal + venmoInTotal + otherInTotal;
  return {
    spendTotal, payrollTotal, venmoInTotal, otherInTotal, totalIn,
    net: totalIn - spendTotal,
    spendCount: spending.length,
    // legacy aliases used in rendering
    expTotal: spendTotal, incTotal: payrollTotal,
    venmoOutTotal: txns.filter(isVenmoOut).reduce((s,t)=>s+t.amount,0),
    expenses: spending, income: payroll, all: txns
  };
}

function catBreakdown(txns){
  const m={};
  txns.filter(isSpending).forEach(t=>{m[t.cat]=(m[t.cat]||0)+t.amount;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function setAcct(a){
  const prevMonth = month;
  acct=a; txFilter='all'; txSearch='';
  // Keep the same month if it exists in the new account, otherwise go to all
  const avail = getMonths();
  month = (prevMonth && avail.includes(prevMonth)) ? prevMonth : null;
  go();
}

// ── MONTH RAIL ────────────────────────────────────────────────────────────────
function renderMonthRail(){
  const months = getMonths();
  const allTxns = filtered();
  const statsByMonth = {};
  months.forEach(m=>{ statsByMonth[m]=calcStats(getMonthTxns(m)); });
  const maxExp = Math.max(...months.map(m=>statsByMonth[m].expTotal),1);
  const maxInc = Math.max(...months.map(m=>statsByMonth[m].incTotal),1);

  const allBtn = `<button class="month-btn${month===null?' active':''}" onclick="setMonth(null)">
    <div class="month-label">All</div>
    <div class="month-bar" style="justify-content:center;align-items:center">
      <span style="font-size:.6rem;color:var(--muted2)">${months.length}mo</span>
    </div>
    <div class="month-amt">${fmtMoney(allTxns.filter(isExpense).reduce((s,t)=>s+t.amount,0))}</div>  </button>`;

  const monthBtns = months.map(m=>{
    const s=statsByMonth[m];
    const expH=Math.round((s.expTotal/maxExp)*22);
    const incH=Math.round((s.incTotal/maxInc)*22);
    const [y,mo]=m.split('-');
    return `<button class="month-btn${month===m?' active':''}" onclick="setMonth('${m}')">
      <div class="month-label">${MONTHS_SHORT[parseInt(mo)-1]} ${y.slice(2)}</div>
      <div class="month-bar">
        <div class="month-bar-col income" style="height:${incH}px"></div>
        <div class="month-bar-col expense" style="height:${expH}px"></div>
      </div>
      <div class="month-amt">${fmtMoney(s.expTotal)}</div>
    </button>`;
  }).join('');

  document.getElementById('month-rail').innerHTML = allBtn + monthBtns;
}
function setMonth(m){ month=m; txFilter='all'; txSearch=''; renderContent(); }

// ── CAT BARS ─────────────────────────────────────────────────────────────────
function renderCatBars(cats, total){
  if(!cats.length) return '<div class="tx-empty">No spending data</div>';
  const top=cats[0][1]||1;
  return `<div class="cat-bar-list">`+cats.map(([cat,amt])=>{
    const color=CAT_COLORS[cat]||'#666';
    const pct=Math.round(amt/total*100);
    const barW=Math.round(amt/top*100);
    return `<div class="cat-bar-item">
      <div class="cat-bar-top">
        <div class="cat-bar-name"><span class="cat-dot" style="background:${color}"></span>${cat}</div>
        <div class="cat-bar-right">${fmtMoney(amt)} <span style="color:var(--muted2);font-weight:400;font-size:.62rem">${pct}%</span></div>
      </div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${barW}%;background:${color}"></div></div>
    </div>`;
  }).join('')+'</div>';
}

// ── TX LIST ───────────────────────────────────────────────────────────────────
function renderTxList(txns, showAcct){
  let list = txns.slice();
  if(txFilter==='expense') list=list.filter(isExpense);
  else if(txFilter==='income') list=list.filter(isIncome);
  else if(txFilter==='venmo') list=list.filter(t=>isVenmoOut(t)||isVenmoIn(t));
  else if(txFilter==='transfer') list=list.filter(isTransfer);
  if(txSearch.trim()){
    const q=txSearch.trim().toLowerCase();
    list=list.filter(t=>t.desc.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q));
  }
  list.sort((a,b)=>b.date.localeCompare(a.date));

  const controls=`<div class="tx-controls">
    <button class="tx-btn${txFilter==='all'?' active':''}" onclick="setTxF('all')">All</button>
    <button class="tx-btn${txFilter==='expense'?' active':''}" onclick="setTxF('expense')">Spending</button>
    <button class="tx-btn${txFilter==='income'?' active':''}" onclick="setTxF('income')">Payroll</button>
    <button class="tx-btn${txFilter==='venmo'?' active':''}" onclick="setTxF('venmo')">Venmo</button>
    <button class="tx-btn${txFilter==='transfer'?' active':''}" onclick="setTxF('transfer')">Transfers</button>
    <input class="tx-search" type="text" placeholder="Search transactions…" value="${txSearch}" oninput="setTxS(this.value)">
  </div>`;

  if(!list.length) return controls+'<div class="tx-empty">No transactions match.</div>';

  const rows=list.map(t=>{
    const d=new Date(t.date+'T12:00:00');
    const dateStr=MONTHS_SHORT[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
    const color=CAT_COLORS[t.cat]||'#666';
    const isFlag=t.cat==='Venmo'&&t.amount>=500;
    const amtClass=t.type==='Credit'?'credit':'debit';
    const sign=t.type==='Credit'?'+':'−';
    return `<div class="tx-row">
      <div class="tx-left">
        <div class="tx-date">${dateStr}</div>
        <div class="tx-name">${t.desc}</div>
        <div class="tx-tags">
          <span class="tx-cat" style="background:${color}18;color:${color}">${t.cat}</span>
          ${showAcct?`<span class="tx-acct">${t.account}</span>`:''}
          ${isFlag?'<span class="tx-flag">⚠ Confirm</span>':''}
        </div>
      </div>
      <div class="tx-amount ${amtClass}">${sign}${fmtMoney(t.amount)}</div>
    </div>`;
  }).join('');

  return controls+`<div class="tx-list-wrap">${rows}</div>`;
}
function setTxF(f){ txFilter=f; renderContentOnly(); }
function setTxS(v){ txSearch=v; renderContentOnly(); }

// ── RECOMMENDATIONS ───────────────────────────────────────────────────────────
function renderRecs(txns, mo){
  const stats=calcStats(txns);
  const cats=catBreakdown(txns);
  const recs=[];

  const foodAmt=cats.find(([c])=>c==='Dining & Delivery')?.[1]||0;
  const foodCount=txns.filter(t=>isSpending(t)&&t.cat==='Dining & Delivery').length;
  const venmoOut=txns.filter(isVenmoOut).reduce((s,t)=>s+t.amount,0);
  const venmoIn=txns.filter(isVenmoIn).reduce((s,t)=>s+t.amount,0);
  const net=stats.net;
  const savRate=stats.totalIn>0?(net/stats.totalIn*100):0;
  const foodShareOfSpend=stats.spendTotal>0?foodAmt/stats.spendTotal:0;

  // Food
  if(foodCount>0){
    const avg=foodAmt/foodCount;
    if(foodShareOfSpend>0.25){
      recs.push({type:'critical',tag:'Food Spending',title:'Food is the biggest spending category',body:`<strong>${Math.round(foodShareOfSpend*100)}% of spending</strong> — ${fmtMoney(foodAmt)} across ${foodCount} transactions, averaging <strong>${fmtMoney(avg)} per visit</strong>. This is the clearest opportunity to cut back.`});
    } else if(foodCount>15){
      recs.push({type:'warning',tag:'Habit',title:'Eating out is a frequent habit',body:`${foodCount} food/coffee transactions. Cooking a few meals a week could save <strong>${fmtMoney(foodAmt*0.3)}</strong> a month.`});
    }
  }

  // Net position
  if(net<0){
    recs.push({type:'critical',tag:'Deficit',title:'Spending more than coming in',body:`Total in was <strong>${fmtMoney(stats.totalIn)}</strong>, spending was <strong>${fmtMoney(stats.spendTotal)}</strong> — a <strong>${fmtMoney(Math.abs(net))} gap</strong>. Worth understanding what covered the difference.`});
  } else if(savRate<15){
    recs.push({type:'warning',tag:'Thin Margin',title:'Very little left over',body:`Only <strong>${fmtMoney(net)}</strong> left after spending (${Math.round(savRate)}% of total in). Part of that came from Venmo — not guaranteed every month.`});
  } else if(savRate>=20){
    recs.push({type:'positive',tag:'Good Position',title:'More coming in than going out',body:`Kept <strong>${fmtMoney(net)}</strong> — ${Math.round(savRate)}% of total in. Once Venmo flows are categorized the picture will be even clearer.`});
  }

  // No payroll
  if(stats.payrollTotal===0){
    recs.push({type:'critical',tag:'No Payroll',title:'No paycheck this period',body:`Zero payroll recorded. All ${fmtMoney(stats.totalIn)} in came from Venmo or other sources — not a reliable baseline to budget from.`});
  }

  // Venmo still uncategorized
  if(venmoOut>1000){
    recs.push({type:'info',tag:'Venmo TBD',title:`${fmtMoney(venmoOut)} out via Venmo — purpose unknown`,body:`Once Saliba explains what these transfers were for, they'll be reclassified into real categories and the spending picture will be much clearer.`});
  }

  // Cash withdrawals
  const cashAmt=cats.find(([c])=>c==='Cash Withdrawal')?.[1]||0;
  if(cashAmt>200){
    recs.push({type:'warning',tag:'Blind Spot',title:'Cash withdrawals are untrackable',body:`<strong>${fmtMoney(cashAmt)}</strong> taken out as cash. Once it leaves the account there's no record of what it bought.`});
  }

  // Gas / car
  const gasAmt=cats.find(([c])=>c==='Gas / Fuel')?.[1]||0;
  if(gasAmt>300&&!mo){
    recs.push({type:'info',tag:'Transportation',title:'Gas spend is significant',body:`<strong>${fmtMoney(gasAmt)}</strong> on fuel over this period. If driving patterns stay the same, that's roughly <strong>${fmtMoney(gasAmt/6)}/month</strong> just on gas.`});
  }

  if(!recs.length) return '';

  return `<div class="rec-section">
    <div class="rec-header">Recommendations</div>
    <div class="rec-grid">${recs.map(r=>`
      <div class="rec-card ${r.type}">
        <div class="rec-tag">${r.tag}</div>
        <div class="rec-title">${r.title}</div>
        <div class="rec-body">${r.body}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

      <div class="stat-sub">payroll + venmo + other</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Spending</div>
      <div class="stat-value negative">${fmtMoney(stats.spendTotal)}</div>
      <div class="stat-sub">${stats.spendCount} transactions</div>
    </div>
    <div class="stat">
      <div class="stat-label">Net</div>
      <div class="stat-value ${stats.net>=0?'positive':'negative'}">${stats.net>=0?'+':'−'}${fmtMoney(Math.abs(stats.net))}</div>
      <div class="stat-sub">${month?'this month':(getMonths().length+' months tracked')}</div>
    </div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-title">Income vs Spending<span class="card-title-right">${label}</span></div>
      ${renderFlowTable(stats)}
    </div>
    <div class="card">
      <div class="card-title">Spending by Category</div>
      ${renderCatBars(cats, stats.expTotal)}
    </div>
  </div>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function renderContent(){
  const txns = month ? getMonthTxns(month) : filtered();
  const label = month ? (()=>{const[y,m]=month.split('-');return MONTHS_SHORT[parseInt(m)-1]+' '+y;})() : 'All Time';
  const showAcct = acct==='All';

  let html = renderSummaryCard(txns, label);
  if(month){
    html += `<div class="card" style="margin-bottom:10px">
      <div class="card-title">Transactions · ${label} <span class="card-title-right" style="color:var(--muted2);font-size:.65rem">${txns.length} total</span></div>
      ${renderTxList(txns, showAcct)}
    </div>`;
  }
  html += renderRecs(txns, !!month);

  document.getElementById('content').innerHTML=html;
  renderMonthRail();
}

function renderContentOnly(){
  if(!month) return;
  const txns=getMonthTxns(month);
  const label=(()=>{const[y,m]=month.split('-');return MONTHS_SHORT[parseInt(m)-1]+' '+y;})();
  const showAcct=acct==='All';
  const txCard=`<div class="card" style="margin-bottom:10px">
    <div class="card-title">Transactions · ${label} <span class="card-title-right" style="color:var(--muted2);font-size:.65rem">${txns.length} total</span></div>
    ${renderTxList(txns, showAcct)}
  </div>`;
  const cards=document.querySelectorAll('.card');
  const last=cards[cards.length-1];
  if(last) last.outerHTML=txCard;
  const s=document.querySelector('.tx-search');
  if(s&&txSearch){s.focus();s.setSelectionRange(txSearch.length,txSearch.length);}
}

function go(){
  renderAcctTabs();
  renderMonthRail();
  renderContent();
}

go();
</script>
</body>
</html>
